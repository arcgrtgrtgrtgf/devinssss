<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Timer - Таймер с котом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.8s ease;
        }

        body.work-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        body.rest-mode {
            background: linear-gradient(135deg, #0d4b3c 0%, #145a32 50%, #1e8449 100%);
        }

        body.idle-mode {
            background: linear-gradient(135deg, #2c2c54 0%, #474787 50%, #2c2c54 100%);
        }

        .container {
            text-align: center;
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .settings {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            color: #fff;
            font-size: 1rem;
            flex-shrink: 0;
            margin-right: 15px;
        }

        .setting-row input {
            width: 80px;
            padding: 8px 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .setting-row input:focus {
            border-color: rgba(255,255,255,0.5);
        }

        .setting-row span {
            color: rgba(255,255,255,0.6);
            margin-left: 8px;
            font-size: 0.85rem;
        }

        .timer-display {
            position: relative;
            margin: 25px auto;
            width: 220px;
            height: 220px;
        }

        .timer-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .timer-circle svg.progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: rgba(255,255,255,0.1);
            stroke-width: 6;
        }

        .progress-ring-fill {
            fill: none;
            stroke: #e74c3c;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
        }

        .progress-ring-fill.rest {
            stroke: #2ecc71;
        }

        .timer-time {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            z-index: 1;
            letter-spacing: 2px;
        }

        .timer-label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            z-index: 1;
            margin-top: 2px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231,76,60,0.4);
        }

        .btn-stop {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-stop:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Cat overlay */
        .cat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }

        .cat-overlay.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cat-popup {
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.3) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .cat-message {
            background: #fff;
            color: #333;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .cat-message::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 14px solid #fff;
        }

        .cat-rest-timer {
            color: #e74c3c;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 15px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .btn-back {
            margin-top: 15px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46,204,113,0.4);
        }

        /* Cat SVG animation */
        .cat-svg-wrapper {
            display: inline-block;
            animation: catBounce 2s ease-in-out infinite;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .cat-tail {
            animation: tailWag 1.5s ease-in-out infinite;
            transform-origin: 30px 140px;
        }

        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }

        .cat-eye-left, .cat-eye-right {
            animation: blink 3s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .cat-eye-left {
            transform-origin: 95px 68px;
        }

        .cat-eye-right {
            transform-origin: 135px 68px;
        }

        .cat-paw-left {
            animation: pawWave 1.2s ease-in-out infinite;
            transform-origin: 80px 130px;
        }

        @keyframes pawWave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }

        /* Cycle counter */
        .cycle-info {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 15px;
        }

        /* Sound toggle */
        .sound-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 1.2rem;
            transition: background 0.3s;
        }

        .sound-toggle:hover {
            background: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body class="idle-mode">

    <div class="sound-toggle" id="soundToggle" title="Sound On/Off">&#128264;</div>

    <div class="container">
        <h1>&#128008; Cat Timer</h1>
        <p class="subtitle">Таймер работы и отдыха с котиком</p>

        <div class="settings" id="settings">
            <div class="setting-row">
                <label>&#9200; Работа:</label>
                <div>
                    <input type="number" id="workMinutes" value="25" min="1" max="180">
                    <span>мин</span>
                </div>
            </div>
            <div class="setting-row">
                <label>&#9749; Отдых:</label>
                <div>
                    <input type="number" id="restMinutes" value="5" min="1" max="60">
                    <span>мин</span>
                </div>
            </div>
        </div>

        <div class="timer-display">
            <div class="timer-circle">
                <svg class="progress-ring" width="220" height="220">
                    <circle class="progress-ring-bg" cx="110" cy="110" r="100"/>
                    <circle class="progress-ring-fill" id="progressRing" cx="110" cy="110" r="100"
                        stroke-dasharray="628.318" stroke-dashoffset="0"/>
                </svg>
                <span class="timer-time" id="timerTime">25:00</span>
                <span class="timer-label" id="timerLabel">Готов к работе</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-start" id="btnStart">&#9654; Старт</button>
            <button class="btn btn-stop" id="btnStop" disabled>&#9632; Стоп</button>
        </div>

        <div class="cycle-info" id="cycleInfo"></div>
    </div>

    <!-- Cat popup overlay -->
    <div class="cat-overlay" id="catOverlay">
        <div class="cat-popup">
            <div class="cat-message" id="catMessage">Мяу! Пора отдохнуть! &#128564;</div>
            <div class="cat-svg-wrapper">
                <svg width="220" height="220" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body -->
                    <ellipse cx="110" cy="140" rx="55" ry="45" fill="#F4A460"/>
                    <ellipse cx="110" cy="145" rx="45" ry="30" fill="#FFDAB9"/>

                    <!-- Tail -->
                    <path class="cat-tail" d="M45 140 Q20 100 35 75 Q40 68 45 75 Q55 100 60 130" fill="#F4A460" stroke="#D2883E" stroke-width="1"/>

                    <!-- Left paw -->
                    <g class="cat-paw-left">
                        <ellipse cx="80" cy="165" rx="15" ry="10" fill="#F4A460"/>
                        <ellipse cx="72" cy="162" rx="5" ry="4" fill="#FFDAB9"/>
                        <ellipse cx="80" cy="160" rx="5" ry="4" fill="#FFDAB9"/>
                        <ellipse cx="88" cy="162" rx="5" ry="4" fill="#FFDAB9"/>
                    </g>

                    <!-- Right paw -->
                    <ellipse cx="140" cy="165" rx="15" ry="10" fill="#F4A460"/>
                    <ellipse cx="132" cy="162" rx="5" ry="4" fill="#FFDAB9"/>
                    <ellipse cx="140" cy="160" rx="5" ry="4" fill="#FFDAB9"/>
                    <ellipse cx="148" cy="162" rx="5" ry="4" fill="#FFDAB9"/>

                    <!-- Head -->
                    <circle cx="110" cy="75" r="42" fill="#F4A460"/>
                    <circle cx="110" cy="80" r="32" fill="#FFDAB9" opacity="0.5"/>

                    <!-- Ears -->
                    <polygon points="75,50 68,15 95,42" fill="#F4A460" stroke="#D2883E" stroke-width="1"/>
                    <polygon points="78,45 73,22 92,42" fill="#FFB6C1"/>
                    <polygon points="145,50 152,15 125,42" fill="#F4A460" stroke="#D2883E" stroke-width="1"/>
                    <polygon points="142,45 147,22 128,42" fill="#FFB6C1"/>

                    <!-- Eyes -->
                    <g class="cat-eye-left">
                        <ellipse cx="95" cy="68" rx="8" ry="9" fill="#fff"/>
                        <ellipse cx="97" cy="69" rx="5" ry="6" fill="#3a3a3a"/>
                        <ellipse cx="98" cy="67" rx="2" ry="2.5" fill="#fff"/>
                    </g>
                    <g class="cat-eye-right">
                        <ellipse cx="125" cy="68" rx="8" ry="9" fill="#fff"/>
                        <ellipse cx="127" cy="69" rx="5" ry="6" fill="#3a3a3a"/>
                        <ellipse cx="128" cy="67" rx="2" ry="2.5" fill="#fff"/>
                    </g>

                    <!-- Nose -->
                    <polygon points="110,80 106,76 114,76" fill="#FF6B6B"/>

                    <!-- Mouth -->
                    <path d="M106 82 Q110 88 114 82" fill="none" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M110 80 L110 82" fill="none" stroke="#8B4513" stroke-width="1.5"/>

                    <!-- Whiskers -->
                    <line x1="60" y1="73" x2="88" y2="78" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
                    <line x1="58" y1="80" x2="88" y2="82" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
                    <line x1="62" y1="87" x2="88" y2="85" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
                    <line x1="160" y1="73" x2="132" y2="78" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
                    <line x1="162" y1="80" x2="132" y2="82" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
                    <line x1="158" y1="87" x2="132" y2="85" stroke="#8B4513" stroke-width="1" opacity="0.6"/>

                    <!-- Blush -->
                    <circle cx="82" cy="82" r="7" fill="#FFB6C1" opacity="0.4"/>
                    <circle cx="138" cy="82" r="7" fill="#FFB6C1" opacity="0.4"/>

                    <!-- Stripes on forehead -->
                    <path d="M100 52 L103 42" stroke="#D2883E" stroke-width="2" stroke-linecap="round"/>
                    <path d="M110 50 L110 40" stroke="#D2883E" stroke-width="2" stroke-linecap="round"/>
                    <path d="M120 52 L117 42" stroke="#D2883E" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="cat-rest-timer" id="catRestTimer">5:00</div>
            <button class="btn-back" id="btnSkipRest">&#128170; Вернуться к работе</button>
        </div>
    </div>

    <script>
        const workInput = document.getElementById('workMinutes');
        const restInput = document.getElementById('restMinutes');
        const timerTime = document.getElementById('timerTime');
        const timerLabel = document.getElementById('timerLabel');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const catOverlay = document.getElementById('catOverlay');
        const catRestTimer = document.getElementById('catRestTimer');
        const catMessage = document.getElementById('catMessage');
        const btnSkipRest = document.getElementById('btnSkipRest');
        const progressRing = document.getElementById('progressRing');
        const settings = document.getElementById('settings');
        const cycleInfo = document.getElementById('cycleInfo');
        const soundToggle = document.getElementById('soundToggle');

        const CIRCUMFERENCE = 2 * Math.PI * 100;
        progressRing.style.strokeDasharray = CIRCUMFERENCE;

        let timer = null;
        let remainingSeconds = 0;
        let totalSeconds = 0;
        let isWorking = false;
        let isResting = false;
        let cycleCount = 0;
        let soundEnabled = true;

        const catMessages = [
            'Мяу! Пора отдохнуть! \uD83D\uDE3A',
            'Мррр~ Отдохни немного! \uD83D\uDCA4',
            'Эй! Глазки устали! \uD83D\uDE3B',
            'Потянись как котик! \uD83D\uDE38',
            'Время для перерыва! \uD83C\uDF1F',
            'Мяу! Хватит работать! \uD83D\uDE3C',
            'Котик говорит: отдых! \u2615',
            'Муррр, сделай паузу! \uD83D\uDE3A',
        ];

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateProgress(remaining, total) {
            const fraction = remaining / total;
            const offset = CIRCUMFERENCE * (1 - fraction);
            progressRing.style.strokeDashoffset = offset;
        }

        function playBeep() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);

                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.frequency.value = 1000;
                    osc2.type = 'sine';
                    gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc2.start(ctx.currentTime);
                    osc2.stop(ctx.currentTime + 0.5);
                }, 200);
            } catch (e) {}
        }

        function startWork() {
            const workMin = parseInt(workInput.value) || 25;
            remainingSeconds = workMin * 60;
            totalSeconds = remainingSeconds;
            isWorking = true;
            isResting = false;

            document.body.className = 'work-mode';
            progressRing.classList.remove('rest');
            settings.style.opacity = '0.5';
            settings.style.pointerEvents = 'none';
            btnStart.disabled = true;
            btnStop.disabled = false;
            timerLabel.textContent = '\uD83D\uDCBB \u0420\u0430\u0431\u043E\u0442\u0430';

            updateDisplay();
            timer = setInterval(tick, 1000);
        }

        function tick() {
            remainingSeconds--;
            updateDisplay();

            if (remainingSeconds <= 0) {
                clearInterval(timer);
                timer = null;

                if (isWorking) {
                    cycleCount++;
                    updateCycleInfo();
                    playBeep();
                    startRest();
                } else if (isResting) {
                    endRest();
                    playBeep();
                    startWork();
                }
            }
        }

        function updateDisplay() {
            timerTime.textContent = formatTime(remainingSeconds);
            updateProgress(remainingSeconds, totalSeconds);

            if (isResting) {
                catRestTimer.textContent = formatTime(remainingSeconds);
            }

            document.title = `${formatTime(remainingSeconds)} - ${isWorking ? '\u0420\u0430\u0431\u043E\u0442\u0430' : '\u041E\u0442\u0434\u044B\u0445'} | Cat Timer`;
        }

        function startRest() {
            const restMin = parseInt(restInput.value) || 5;
            remainingSeconds = restMin * 60;
            totalSeconds = remainingSeconds;
            isWorking = false;
            isResting = true;

            document.body.className = 'rest-mode';
            progressRing.classList.add('rest');
            timerLabel.textContent = '\u2615 \u041E\u0442\u0434\u044B\u0445';

            catMessage.textContent = catMessages[Math.floor(Math.random() * catMessages.length)];
            catOverlay.classList.add('visible');

            updateDisplay();
            timer = setInterval(tick, 1000);
        }

        function endRest() {
            catOverlay.classList.remove('visible');
        }

        function stopTimer() {
            clearInterval(timer);
            timer = null;
            isWorking = false;
            isResting = false;
            remainingSeconds = 0;

            document.body.className = 'idle-mode';
            progressRing.classList.remove('rest');
            progressRing.style.strokeDashoffset = 0;
            settings.style.opacity = '1';
            settings.style.pointerEvents = 'auto';
            btnStart.disabled = false;
            btnStop.disabled = true;
            timerLabel.textContent = '\u0413\u043E\u0442\u043E\u0432 \u043A \u0440\u0430\u0431\u043E\u0442\u0435';
            timerTime.textContent = formatTime(parseInt(workInput.value || 25) * 60);
            catOverlay.classList.remove('visible');
            document.title = 'Cat Timer - \u0422\u0430\u0439\u043C\u0435\u0440 \u0441 \u043A\u043E\u0442\u043E\u043C';
        }

        function updateCycleInfo() {
            cycleInfo.textContent = `\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u043E \u0446\u0438\u043A\u043B\u043E\u0432: ${cycleCount}`;
        }

        btnStart.addEventListener('click', startWork);
        btnStop.addEventListener('click', stopTimer);
        btnSkipRest.addEventListener('click', () => {
            clearInterval(timer);
            timer = null;
            endRest();
            startWork();
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '\uD83D\uDD08' : '\uD83D\uDD07';
            soundToggle.title = soundEnabled ? 'Sound On' : 'Sound Off';
        });

        workInput.addEventListener('input', () => {
            if (!isWorking && !isResting) {
                timerTime.textContent = formatTime((parseInt(workInput.value) || 25) * 60);
            }
        });

        timerTime.textContent = formatTime(parseInt(workInput.value || 25) * 60);
    </script>
</body>
</html>
